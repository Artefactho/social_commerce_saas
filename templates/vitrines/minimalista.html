<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ store.nome }}</title>
    
    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Lora:wght@400;700&family=Manrope:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- CSS LOCAL -->
    <link rel="stylesheet" href="/static/css/minimalista.css">
    
    <style>
        :root {
            --primary: {{ tema.cor_primaria }};
            --secondary: {{ tema.cor_secundaria }};
        }
    </style>
</head>

<body class="font-{{ tema.fonte_familia }}">

<header class="nav fixed {{ tema.alinhamento_logo }}">
    <div class="container nav-content" style="display: flex; align-items: center; justify-content: space-between; padding: 15px;">
        <h1 class="logo" style="margin: 0; font-size: 20px; font-weight: 800;">{{ store.nome }}</h1>
        <div class="nav-actions">
            <a href="https://wa.me/{{ store.whatsapp_numero }}" class="cart" target="_blank" style="text-decoration: none;">🛒</a>
        </div>
    </div>
</header>

<main>
    {% if tema.mostrar_banner and store.banner_topo %}
    <section class="banner" style="padding: 10px;">
        <div class="img-banner" style="background-image: url('{{ store.banner_topo.url }}'); height: 200px; background-size: cover; background-position: center; border-radius: 15px;"></div>
    </section>
    {% endif %}

    <div class="container" style="padding: 15px;">
        <div class="product-grid">
            {% for product in produtos %}
            <div class="product-card">
                <div class="product-img" style="background-image: url('{% if product.imagem %}{{ product.imagem.url }}{% else %}https://via.placeholder.com/400{% endif %}');"></div>
                <div class="product-info">
                    <h3 class="product-title">{{ product.nome }}</h3>
                    <div class="product-price">R$ {{ product.preco }}</div>
                    <a href="https://wa.me/{{ store.whatsapp_numero }}?text=Quero%20comprar%20{{ product.nome }}" target="_blank" class="btn-buy">
                        Comprar
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</main>

<footer class="footer" style="padding: 40px 0; text-align: center; font-size: 12px; color: #aaa;">
    <p>© {{ store.nome }} - Minimalist Style</p>
</footer>

</body>
</html>
