<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ loja.nome }}</title>
    
    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=PT+Serif:wght@400;700&family=Archivo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- CSS LOCAL -->
    <link rel="stylesheet" href="/static/css/classico.css">
    
    <style>
        :root {
            --primary: {{ tema.cor_primaria }};
            --secondary: {{ tema.cor_secundaria }};
        }
    </style>
</head>

<body class="font-{{ tema.fonte_familia }}">

<header class="nav {{ tema.alinhamento_logo }}">
    <div class="container nav-content" style="padding: 20px; border-bottom: 2px solid #000; margin-bottom: 30px;">
        <h1 class="logo" style="text-transform: uppercase;">{{ loja.nome }}</h1>
        <div class="nav-actions">
            <a href="https://wa.me/{{ loja.whatsapp_numero }}" class="cart" target="_blank">CARRINHO</a>
        </div>
    </div>
</header>

<main>
    <div class="container">
        <div class="section-header" style="text-align: center; margin-bottom: 40px;">
            <h2 style="font-weight: 900;">COLEÇÃO ATUAL</h2>
            <p style="color: #666;">Confira nossas novidades e promoções</p>
        </div>

        <div class="product-grid">
            {% for product in produtos %}
            <div class="product-card">
                <div class="product-img" style="background-image: url('{% if product.imagem %}{{ product.imagem.url }}{% else %}https://via.placeholder.com/400{% endif %}');"></div>
                <div class="product-info">
                    <h3 class="product-title">{{ product.nome }}</h3>
                    <div class="product-price">R$ {{ product.preco }}</div>
                    <a href="https://wa.me/{{ loja.whatsapp_numero }}?text=Quero%20comprar%20{{ product.nome }}" target="_blank" class="btn-buy">
                        ADICIONAR
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</main>

<footer class="footer" style="margin-top: 60px; padding: 40px; background: #eee; text-align: center; font-weight: 700;">
    <p>© COPYRIGHT {{ loja.nome }}</p>
</footer>

</body>
</html>
