<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ store.nome }}</title>
    
    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=Syne:wght@400;800&display=swap" rel="stylesheet">
    
    <!-- CSS LOCAL -->
    <link rel="stylesheet" href="/static/css/studio.css">
    
    <style>
        :root {
            --primary: {{ tema.cor_primaria }};
            --secondary: {{ tema.cor_secundaria }};
        }
    </style>
</head>

<body class="font-{{ tema.fonte_familia }}">

<header class="nav {{ tema.alinhamento_logo }}">
    <div class="container nav-content" style="padding: 20px;">
        <h1 class="logo" style="font-size: 32px; letter-spacing: -2px;">{{ store.nome }}</h1>
        <div class="nav-actions">
            <input type="text" placeholder="BUSCAR" style="border: none; border-bottom: 2px solid #000; outline: none; margin-right: 20px; font-weight: 700;">
            <a href="https://wa.me/{{ store.whatsapp_numero }}" class="cart" target="_blank">🛒</a>
        </div>
    </div>
</header>

<main>
    <!-- HERO / SPOTLIGHT -->
    <section class="hero" style="height: 60vh; display: flex; align-items: center; justify-content: center; background: #fdfdfd; margin-bottom: 50px;">
        <div class="container center" style="max-width: 800px; text-align: center;">
            <h1 style="font-size: clamp(40px, 8vw, 100px); line-height: 0.9; margin-bottom: 20px;">{{ store.nome }}</h1>
            <p style="font-size: 18px; color: #555;">{{ store.subtitulo_loja|default:"CURATED SELECTION FOR THE CREATIVE MIND" }}</p>
        </div>
    </section>

    <div class="container">
        <div class="product-grid">
            {% for product in produtos %}
            <div class="product-card">
                <div class="product-img" style="background-image: url('{% if product.imagem %}{{ product.imagem.url }}{% else %}https://via.placeholder.com/400{% endif %}');"></div>
                <div class="product-info">
                    <h3 class="product-title">{{ product.nome }}</h3>
                    <div class="product-price">R$ {{ product.preco }}</div>
                    <a href="https://wa.me/{{ store.whatsapp_numero }}?text=Quero%20comprar%20{{ product.nome }}" target="_blank" class="btn-buy">
                        BUY NOW
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</main>

<footer class="footer" style="margin-top: 100px; padding-bottom: 100px; text-align: center; font-size: 14px; opacity: 0.5;">
    <p>© {{ store.nome }} STUDIO</p>
</footer>

</body>
</html>
