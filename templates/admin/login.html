{% extends "admin/login.html" %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .password-container input {
            width: 100%;
            padding-right: 40px !important; /* Space for the icon */
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            cursor: pointer;
            user-select: none;
            color: #666;
            font-size: 1.2rem;
            z-index: 10;
        }
        
        .toggle-password:hover {
            color: #333;
        }
    </style>
{% endblock %}

{% block content %}
    {{ block.super }}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var passwordField = document.getElementById('id_password');
            if (passwordField) {
                var container = document.createElement('div');
                container.className = 'password-container';
                
                // Keep password field inside the new container
                passwordField.parentNode.insertBefore(container, passwordField);
                container.appendChild(passwordField);
                
                // Create the toggle icon
                var icon = document.createElement('span');
                icon.className = 'toggle-password';
                icon.innerHTML = '👁️'; // Eye icon
                icon.title = "Mostrar/Ocultar Senha";
                
                container.appendChild(icon);
                
                icon.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (passwordField.type === 'password') {
                        passwordField.type = 'text';
                        // icon.innerHTML = '👁️‍🗨️'; // Optional alternate icon
                        icon.style.opacity = '0.5';
                    } else {
                        passwordField.type = 'password';
                        icon.innerHTML = '👁️';
                        icon.style.opacity = '1';
                    }
                });
            }
        });
    </script>
{% endblock %}
