name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # TODO(Fase 1, docs/ROADMAP_DE_EXECUCAO.md): a suite real de testes
        # ainda não existe (só a infraestrutura, vitest.config.ts +
        # src/test/setup.ts). Remover `continue-on-error` assim que houver
        # pelo menos um teste real de auth/onboarding/checkout.
        run: npm run test
        continue-on-error: true

      - name: Build
        run: npm run build
