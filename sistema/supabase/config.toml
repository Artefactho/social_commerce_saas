project_id = "saas-social-commerce"

# site_url/additional_redirect_urls controlam pra onde o GoTrue (Supabase
# Auth) tem permissão de redirecionar depois de processar um link de e-mail
[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/**", "http://127.0.0.1:8080/**"]

# Edge Functions Configuration
[functions.create-order]
verify_jwt = false

[functions.mercadopago-webhook]
verify_jwt = false

[functions.mercadopago-callback]
verify_jwt = false

[functions.check-order-status]
verify_jwt = false

[functions.mercadopago-connect]
verify_jwt = false

[functions.mercadopago-connection-status]
verify_jwt = false
